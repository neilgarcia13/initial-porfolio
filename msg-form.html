<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FONT CONNECTOR -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

    <!-- ICONS CONNECTOR -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" type="x-icon" href="img/brand-icon.png">

    <title>Message Form</title>

</head>
<body>
    
    <header>
        <nav>
            <div class="logo-container">
                <a href="main.html"><img class="logo" src="img/brand-icon.png" width="128px"></a>
            </div>
    
            <div class="link-container">
                <a class="link" href="main.html">Home</a>
                <a class="link" href="#educ">Education</a>
                <a class="link" href="#about">About</a>
            </div>

            <div class="btncontact-container">
                <a href="#contact"><button class="btn-contact">Contact Me</button></a>
            </div>
        </nav>
    </header>
    
    <div class="opening-text">
        <h1 class="heading">Have a Message?</h1>
        <p class="msg-subtext">Please fill out all the information below. Thanks!</p>
    </div>

    <form>

        <div class="form-container">

            

            <input class="textbox" type="text" required placeholder="Enter full name">  
            <input class="textbox" type="text" required placeholder="Enter email">
            <input class="textbox" type="text" required placeholder="Enter phone number">
            <input class="textbox" type="text" required placeholder="Enter subject">

            <div class="textarea-container">
                <textarea name="" id="" cols="60" rows="10" placeholder="Type your message"></textarea>
            </div>
            
            <br>

            <button class="btn-submit">Submit</button>

        </div>

    </form>
    
    <footer>
            <div class="logo-container">
                <img class="logo" src="img/brand-icon.png">
            </div>
    
            <div class="mid-section">
                <p class="quote">Betterment over perfection.</p>
                <p class="copyright-text">Neil’s Production © 2024</p>
            </div>
    
            <div class="socials-section">
                <a href="https://www.facebook.com/NeeeeeeeilAndreeeeei" target="_blank"><i class="fa-brands fa-facebook-f fa-3x" style="color: #000000;"></i></a>
                <a href="https://www.linkedin.com/in/neil-garcia-/" target="_blank"><i class="fa-brands fa-linkedin-in fa-3x" style="color: #000000;"></i></a>
                <a href="https://www.instagram.com/neilcutter13/" target="_blank"><i class="fa-brands fa-instagram fa-3x" style="color: #000000;"></i></a>
            </div>   
        </footer>
